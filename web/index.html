<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdash</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">◈ Markdash</div>
    <nav>
      <a href="#overview" class="nav-item active" data-view="overview">Overview</a>
      <a href="#tasks" class="nav-item" data-view="tasks">Tasks</a>
      <a href="#decisions" class="nav-item" data-view="decisions">Decisions &amp; Risks</a>
      <a href="#tests" class="nav-item" data-view="tests">Tests</a>
      <a href="#docs" class="nav-item" data-view="docs">Documents</a>
    </nav>
    <div class="side-foot">
      <div id="workspace-picker" class="hidden">
        <label class="workspace-label" for="workspace-select">Workspace</label>
        <select id="workspace-select"></select>
      </div>
      <input id="search" type="search" placeholder="Search documents…" />
      <div id="updated-at" class="muted"></div>
    </div>
  </aside>
  <main id="main"></main>
  <div id="doc-panel" class="doc-panel hidden">
    <button id="doc-close" class="doc-close">×</button>
    <article id="doc-content"></article>
  </div>
  <script src="app.js"></script>
</body>
</html>
