<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:512px;height:512px;}
  body{background:radial-gradient(130% 130% at 12% 8%,#161c2c 0%,#0a0c12 52%,#06070b 100%);
    position:relative;overflow:hidden;font-family:-apple-system,"SF Pro Display","Helvetica Neue",sans-serif;}
  .blob{position:absolute;border-radius:50%;filter:blur(50px);}
  .b1{width:330px;height:330px;left:-90px;top:-80px;opacity:.85;
      background:radial-gradient(circle at 38% 38%,#6ea8fe,#2f5bd0 58%,transparent 72%);}
  .b2{width:330px;height:330px;right:-100px;bottom:-80px;opacity:.9;
      background:radial-gradient(circle at 42% 42%,#b98bff,#6d3fe0 58%,transparent 72%);}
  .b3{width:170px;height:170px;left:52%;top:-40px;opacity:.4;
      background:radial-gradient(circle at 50% 50%,#8ab0ff,#3b5bd8 55%,transparent 72%);}
  .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .glass{position:relative;width:332px;height:332px;border-radius:80px;
    background:linear-gradient(155deg,rgba(255,255,255,.30) 0%,rgba(255,255,255,.08) 24%,
      rgba(255,255,255,.03) 50%,rgba(255,255,255,.09) 78%,rgba(255,255,255,.18) 100%);
    -webkit-backdrop-filter:blur(28px) saturate(165%);backdrop-filter:blur(28px) saturate(165%);
    border:1px solid rgba(255,255,255,.40);
    box-shadow:0 32px 72px rgba(0,0,0,.6),0 6px 20px rgba(0,0,0,.35),
      inset 0 1.5px 1px rgba(255,255,255,.78),inset 0 -12px 28px rgba(255,255,255,.10),
      inset 0 16px 32px rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .glass::before{content:"";position:absolute;left:11%;right:11%;top:4%;height:33%;
    border-radius:64px 64px 96px 96px;
    background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.04) 72%,transparent);
    filter:blur(2px);opacity:.7;}
  .glyph{position:relative;z-index:2;display:flex;align-items:flex-end;gap:18px;height:124px;
    filter:drop-shadow(0 3px 8px rgba(8,12,26,.6));}
  .bar{width:36px;border-radius:12px;
    background:linear-gradient(180deg,#ffffff,rgba(255,255,255,.80));
    box-shadow:inset 0 2px 2px rgba(255,255,255,.95),inset 0 -5px 9px rgba(70,90,180,.4);}
  .bar1{height:58px;}.bar2{height:92px;}.bar3{height:124px;}
</style></head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="stage"><div class="glass"><div class="glyph">
    <div class="bar bar1"></div><div class="bar bar2"></div><div class="bar bar3"></div>
  </div></div></div>
</body></html>
